name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required files are present
        run: |
          for f in README.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE docs/design.md docs/phase-0.md \
                   bench/README.md driver/README.md qrcd/README.md backend/README.md tests/README.md; do
            test -s "$f" || { echo "::error file=$f::missing or empty"; exit 1; }
          done
      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --accept 200,206,429
            --exclude '^https://discord\.gg/'
            './**/*.md'
          fail: true

  corpus:
    name: Corpus check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pins are verified against public remotes; the token is not needed, and the
          # next steps run code from the checked-out revision.
          persist-credentials: false
      - name: The ref resolver and the patterns pass their self-test
        run: python3 scripts/check-corpus.py --self-test
      - name: bench/corpus.toml is well formed and every pin resolves at its remote
        run: python3 scripts/check-corpus.py --verify-pins bench/corpus.toml

  harness:
    name: Harness check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The bench scripts compile and the analysis passes its self-test
        run: |
          python3 -m py_compile bench/run.py bench/analyze.py scripts/check-corpus.py
          python3 bench/run.py --list
          python3 bench/run.py --self-test
          python3 bench/analyze.py --self-test
          python3 bench/critical_path.py --self-test

  shell:
    name: Shell check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck comes with the ubuntu-24.04 image (its readme lists it under apt packages).
      - name: shellcheck version
        run: shellcheck --version
      - name: Every tracked shell script passes shellcheck
        # bash (not the default shell) adds pipefail, so a git ls-files failure fails the step.
        shell: bash
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
